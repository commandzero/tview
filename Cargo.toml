[package]
name = "tview"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
description = "A command-line CSV and tabular data viewer"
repository = "https://github.com/commandzero/tview"

[lints.rust]
unsafe_code = "deny"

[[bin]]
name = "tview"
path = "src/main.rs"

[features]
default = ["saved-views", "sqlite", "clipboard"]
all = ["saved-views", "sqlite", "clipboard", "elasticsearch"]
clipboard = ["dep:arboard"]
elasticsearch = [
    "dep:elasticsearch",
]
saved-views = [
    "dep:num-format",
    "dep:semver",
]
sqlite = [
    "dep:turso",
]

[dependencies]
anyhow = "1.0"
arboard = { version = "3.6.1", optional = true }
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
crossterm = { version = "0.29.0", features = ["use-dev-tty"] }
encoding_rs = "0.8.41"
elasticsearch = { version = "=9.1.0-alpha.1", optional = true, default-features = false, features = ["native-tls"] }
num-format = { version = "0.4", optional = true }
ratatui = "0.30.2"
regex = "1.13.1"
semver = { version = "1.0", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision", "preserve_order", "raw_value"] }
thiserror = "2.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync"] }
turso = { version = "=0.7.2", optional = true, default-features = false, features = ["mimalloc"] }
unicode-width = "0.2.2"
url = "2.5.8"
yaml_serde = "0.10.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[dev-dependencies]
assert_cmd = "2.2"
insta = "1.48"
libc = "0.2"
predicates = "3.1"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled-full"] }
tempfile = "3.27"
